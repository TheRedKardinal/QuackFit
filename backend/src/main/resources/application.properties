spring.application.name=quackfit

# Variabili locali da env.properties (escluso da Git, vedi env.properties.example).
# "optional": online il file non c'è e le stesse chiavi arrivano come variabili d'ambiente.
spring.config.import=optional:file:env.properties

# Database (profilo default: PostgreSQL locale)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema generato e aggiornato da Hibernate
spring.jpa.hibernate.ddl-auto=update

# Niente accesso al database fuori dai service: le entità si convertono in DTO
# dentro metodi @Transactional (vedi backend/CLAUDE.md, sezione Entità)
spring.jpa.open-in-view=false

# Sicurezza (vedi backend/CLAUDE.md, sezione Configurazione)
quackfit.jwt.segreto=${JWT_SECRET}
quackfit.jwt.durata=${JWT_DURATA:24h}
quackfit.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Superadmin creato dal seeder se non esiste (vedi backend/CLAUDE.md, sezione Seeder)
quackfit.superadmin.email=${SUPERADMIN_EMAIL:}
quackfit.superadmin.password=${SUPERADMIN_PASSWORD:}

# Nessun utente in memoria generato da Spring Boot: gli utenti sono solo quelli del database,
# caricati dal filtro JWT
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Email (vedi backend/CLAUDE.md, sezione Configurazione)
quackfit.mail.modalita=${MAIL_MODALITA:log}
quackfit.mail.mittente=${MAIL_MITTENTE:}
quackfit.mail.nome-mittente=${MAIL_NOME_MITTENTE:QuackFit}
quackfit.mail.brevo.api-key=${BREVO_API_KEY:}
quackfit.mail.brevo.url=https://api.brevo.com/v3/smtp/email

# Cloudinary per la foto profilo (vedi backend/CLAUDE.md, sezione Configurazione).
# Chiavi facoltative in locale e nei test; obbligatorie all'avvio nel profilo prod.
quackfit.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
quackfit.cloudinary.api-key=${CLOUDINARY_API_KEY:}
quackfit.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
quackfit.cloudinary.url=https://api.cloudinary.com/v1_1
quackfit.cloudinary.chiavi-obbligatorie=false

# Upload della foto profilo: al massimo 2 MB (vedi me.md, Foto profilo). La richiesta può essere un po' più grande
# del file (intestazioni del multipart). Oltre il limite: 400 FILE_NON_VALIDO (ExceptionsHandler).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# SMTP Gmail (solo con MAIL_MODALITA=smtp, in locale). Timeout di 10 secondi:
# una connessione appesa non deve bloccare la richiesta
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
