# Profilo prod (deploy online): nessun env.properties, tutte le chiavi
# (DB_URL, DB_USERNAME, DB_PASSWORD, ...) arrivano come variabili d'ambiente
# e vengono risolte dai segnaposto di application.properties.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# IP reale dietro il proxy di Render: la RemoteIpValve di Tomcat legge X-Forwarded-For da destra
# saltando i proxy interni, così un valore inventato dal client non cambia l'IP (vedi backend/CLAUDE.md,
# sezione Limite per indirizzo IP). Da verificare al deploy (task 49).
server.forward-headers-strategy=native

# In produzione le email partono solo tramite l'API HTTP di Brevo (mai nel log)
quackfit.mail.modalita=brevo
