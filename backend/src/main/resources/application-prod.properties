# Profilo prod (deploy online): nessun env.properties, tutte le chiavi
# (DB_URL, DB_USERNAME, DB_PASSWORD, ...) arrivano come variabili d'ambiente
# e vengono risolte dai segnaposto di application.properties.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# IP reale dietro il proxy di Render (task 49b, verificato con un log temporaneo): davanti a Render c'è Cloudflare, con
# IP pubblici. Leggendo X-Forwarded-For da destra la RemoteIpValve si fermava sul nodo Cloudflare (diverso a ogni
# richiesta) e il limite per IP non scattava mai. Render invece mette in True-Client-IP l'IP vero del client e lo
# SOVRASCRIVE sempre: un valore inventato dal client non arriva al backend. La valvola si fida solo del proxy interno di
# Render (IP privato 10.x, già tra quelli "interni" di default) e da lì prende l'IP da True-Client-IP.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=True-Client-IP

# In produzione le email partono solo tramite l'API HTTP di Brevo (mai nel log):
# senza BREVO_API_KEY e MAIL_MITTENTE l'app non parte (costruttore di BrevoMailService)
quackfit.mail.modalita=brevo

# In produzione le tre chiavi Cloudinary sono obbligatorie: se ne manca una l'app non parte
# e il messaggio nomina le variabili mancanti (mai i valori)
quackfit.cloudinary.chiavi-obbligatorie=true

# Porta: Render la indica nella variabile PORT (in locale resta 8080)
server.port=${PORT:8080}
